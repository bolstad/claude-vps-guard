# GitHub Pages configuration. The site is the README: Pages renders README.md
# as the index when no index.md exists, so there is no second copy of the docs
# to keep in sync. The relative links in the README (docs/platforms.md and the
# config examples) are rewritten by the jekyll-relative-links plugin, which
# GitHub Pages enables by default.
title: claude-vps-guard
# Kept short and complementary: the README's opening paragraph directly below
# it already states the problem, and the two sit stacked on the site even
# though they never appear together on GitHub. The repository description on
# GitHub is set separately and stays longer.
description: Memory caps and a watchdog for long-running Claude Code sessions. Linux and macOS.
theme: jekyll-theme-cayman
